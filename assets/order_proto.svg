<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <style>
    .box { fill:#f8f9fb; stroke:#2b6cb0; stroke-width:2; rx:6; }
    .small { font:12px sans-serif; fill:#2d3748; }
    .title { font:14px sans-serif; font-weight:700; fill:#1a202c; }
    .arrow { stroke:#2b6cb0; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- Producer -->
  <rect x="30" y="30" width="180" height="70" class="box" />
  <text x="120" y="55" text-anchor="middle" class="title">Generator</text>
  <text x="120" y="75" text-anchor="middle" class="small">publish orders.commands</text>

  <!-- Redpanda topics -->
  <rect x="260" y="20" width="200" height="110" class="box" />
  <text x="360" y="45" text-anchor="middle" class="title">Redpanda Topics</text>
  <text x="360" y="65" text-anchor="middle" class="small">orders.commands</text>
  <text x="360" y="82" text-anchor="middle" class="small">orders.lines</text>
  <text x="360" y="99" text-anchor="middle" class="small">orders.clients</text>

  <!-- RisingWave sources -->
  <rect x="520" y="30" width="220" height="70" class="box" />
  <text x="630" y="55" text-anchor="middle" class="title">RisingWave</text>
  <text x="630" y="75" text-anchor="middle" class="small">src_orders / src_order_lines</text>

  <!-- MVs -->
  <rect x="30" y="150" width="300" height="160" class="box" />
  <text x="180" y="175" text-anchor="middle" class="title">Materialized Views</text>
  <text x="180" y="195" text-anchor="middle" class="small">mv_order_items (agg jsonb_agg)</text>
  <text x="180" y="215" text-anchor="middle" class="small">mv_order_360 (join customers + items)</text>
  <text x="180" y="235" text-anchor="middle" class="small">sink -> OpenSearch</text>

  <!-- OpenSearch Sink -->
  <rect x="360" y="220" width="320" height="90" class="box" />
  <text x="520" y="245" text-anchor="middle" class="title">OpenSearch</text>
  <text x="520" y="265" text-anchor="middle" class="small">orders_360 index</text>

  <!-- Arrows -->
  <path class="arrow" d="M210 65 L260 65" />
  <path class="arrow" d="M460 65 L520 65" />
  <path class="arrow" d="M360 130 L360 150" />
  <path class="arrow" d="M360 230 L360 220" />
  <path class="arrow" d="M330 250 L360 240" />

  <!-- Timeline: command then lines -->
  <g>
    <text x="760" y="40" class="title">Timeline</text>
    <rect x="700" y="50" width="240" height="150" fill="#fff8e6" stroke="#d69e2e" stroke-width="1" rx="6" />
    <text x="740" y="80" class="small">t0: publish orders.commands (orderId=123)</text>
    <circle cx="730" cy="85" r="4" fill="#d69e2e" />

    <text x="740" y="110" class="small">t1: publish orders.lines item A (first line)</text>
    <circle cx="730" cy="115" r="4" fill="#2b6cb0" />

    <text x="740" y="140" class="small">t2: publish orders.lines item B (later)</text>
    <circle cx="730" cy="145" r="4" fill="#2b6cb0" />

    <text x="740" y="170" class="small">t3: publish orders.lines item C (last)</text>
    <circle cx="730" cy="175" r="4" fill="#2b6cb0" />

    <text x="740" y="200" class="small">Result: mv_order_items updated progressively</text>
  </g>

  <!-- Note -->
  <text x="30" y="340" class="small">Problématique: la commande (root) est visible avant que toutes les lignes arrivent. Les MVs doivent agréger incrémentalement et assurer la cohérence par orderId / compaction.</text>
</svg>
